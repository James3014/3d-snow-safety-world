</style></head><body><main><h1>第一題｜原版 vs 67.js</h1><p>相同的坡頂盲區劇情與 A／B／C 人物最終位置。以下是真實 Chrome 渲染截圖，不是設計模擬圖。切換分支觀察角色位置、雪道遮蔽與光影。</p><nav><button data-choice="A" aria-pressed="false">A｜不減速</button><button data-choice="B" aria-pressed="false">B｜先減速</button><button data-choice="C" aria-pressed="true">C｜停在盲區</button><button data-choice="eye" aria-pressed="false">你的視角｜決策前</button><a href="./">操作 67.js 互動版</a></nav>
<section class="cols"><figure class="card"><header>現有原版 WebGL<small>第 1 題 v2.3 系列｜既有系統</small></header><img id="old" src="./test-results/original-branch-C.png" alt="現有 WebGL 第 1 題 C 分支最後畫面"><figcaption>原始 WebGL：有既有的角色造型、圖形語言、完整互動控制。</figcaption></figure><figure class="card"><header>67.js 0.19.0 試作<small>同一題、不同渲染引擎｜獨立原型</small></header><img id="new" src="./test-results/67-branch-C.png" alt="67.js 第 1 題 C 分支最後畫面"><figcaption>67.js Renderer67 / WebGL2：雪道與三位滑手均由真正 3D 幾何物件渲染；引擎更換不代表內容全等價。</figcaption></figure></section>
